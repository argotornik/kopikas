# Hourly LHV sync. Vercel Hobby crons run at most once a day (vercel.json keeps
# the 05:00 UTC run as a backstop); this pokes /api/sync every hour with the
# same CRON_SECRET bearer the route already checks. Sync is idempotent (upsert
# by transaction id), so overlaps with the Vercel cron are harmless.
#
# Repo settings needed once:
#   Secrets   → CRON_SECRET  (same value as the Vercel env var)
#   Variables → SYNC_URL     (your deployment's /api/sync; there is no default,
#                             so a fork never pokes someone else's instance)
#
# Actions logs of a public repository are public: the step prints the HTTP
# status, and the response body only when the call fails.
name: Hourly LHV sync

on:
  schedule:
    - cron: "7 * * * *" # :07 past every hour — off the top-of-hour rush
  workflow_dispatch: {}

concurrency:
  group: lhv-sync
  cancel-in-progress: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      SYNC_URL: ${{ vars.SYNC_URL }}
    steps:
      - name: Call /api/sync
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SYNC_URL" ]; then
            echo "Set the CRON_SECRET secret and the SYNC_URL variable on this repository" >&2
            exit 1
          fi
          code=$(curl --silent --output /tmp/sync.json --write-out '%{http_code}' \
            --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SYNC_URL")
          echo "sync → HTTP $code"
          if [ "$code" != "200" ]; then
            cat /tmp/sync.json >&2
            exit 1
          fi
